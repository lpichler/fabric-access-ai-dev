name: PR title format

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled]

permissions: {}

jobs:
  validate-title:
    if: >-
      github.event.pull_request.user.type == 'Bot' ||
      github.event.pull_request.user.login == 'platex-rehor-bot' ||
      contains(github.event.pull_request.labels.*.name, vars.BOT_PR_LABEL || 'dev-bot')
    runs-on: ubuntu-latest
    steps:
      - name: Validate Jira-prefixed title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("PR_TITLE", "")
          pattern = r"\[[A-Z][A-Z0-9]*-\d+\]: \S(?:.*\S)?"
          if re.fullmatch(pattern, title) is None:
              print("::error::PR title must match [PROJECT-12345]: <title>")
              sys.exit(1)
          PY
